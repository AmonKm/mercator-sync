# FR : Gestion des sources
# EN : Sources management
sources:
  vcenter_prod_1:
    type: vcenter
    name_id: vcenter-1
    base_url: VCENTER_URL_1
    auth:
      username_env: VCENTER_USER_1
      password_env: VCENTER_PASS_1
    verify_ssl: false
    enabled: true

  vcenter_prod_2:
    type: vcenter
    name_id: vcenter-2
    base_url: VCENTER_URL_2
    auth:
      username_env: VCENTER_USER_2
      password_env: VCENTER_PASS_2
    verify_ssl: false
    enabled: true

  xoa_prod:
    type: xoa
    name_id: xoa
    base_url: XOA_URL
    pool_id: "mon_pool_id"
    auth:
      username_env: XOA_USER
      password_env: XOA_PASS
      token_env: XOA_TOKEN
    verify_ssl: false
    enabled: true
    
  proxmox_prod:
    type: proxmox
    name_id: proxmox
    base_url: PROXMOX_URL
    auth:
      user_env: PROXMOX_USER
      token_env: PROXMOX_TOKEN
    verify_ssl: false
    enabled: true

destination:
  mercator:
    base_url: MERCATOR_URL
    auth:
      username_env: MERCATOR_USER
      password_env: MERCATOR_PASS
  grist:
    base_url: "https://grist.numerique.gouv.fr"
    table_id: Registre_des_Fiches_de_Traitements
    mapping_table_id: Mercator_mappage
    auth:
      doc_id_env: GRIST_DOC_ID
      token_env: GRIST_API_TOKEN

# FR : Listes des endpoints et des clé à utiliser selon le type de la source
# EN : Lists of endpoints and keys to use according to the type of source
mappings:
  vcenter:
    cluster:
      mercator_endpoint: /api/clusters
      mercator_key: vcenter_id
      source_key: cluster
    logical_server:
      mercator_endpoint: /api/logical-servers
      mercator_key: vcenter_id
      source_key: vm

  xoa:
    cluster:
      mercator_endpoint: /api/clusters
      mercator_key: xcpng_id
      source_key: id
    logical_server:
      mercator_endpoint: /api/logical-servers
      mercator_key: xcpng_id
      source_key: id
      
  proxmox:
    cluster:
      mercator_endpoint: /api/clusters
      mercator_key: proxmox_id
      source_key: node
    logical_server:
      mercator_endpoint: /api/logical-servers
      mercator_key: proxmox_id
      source_key: vmid

sync:
  orphan_tag: "etat_sync:orphelin"
  dry_run: false
